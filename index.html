<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Gallery Pro</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🎥 Video Gallery Pro</h1>
      <input type="text" id="searchInput" placeholder="🔍 Cari video..." />
    </header>

    <div class="controls-bottom">
      <select id="tagFilter"><option value="">📂 Semua Kategori</option></select>
      <div class="pagination" id="pagination"></div>
    </div>

    <div class="video-grid" id="videoGrid"></div>
    <div class="pagination-bottom" id="paginationBottom"></div>
  </div>

  <!-- Modal untuk pemutar video -->
  <div id="videoModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h3 id="videoTitle" style="text-align:center; margin:20px 0; color:#eee;"></h3>
      <div id="videoPlayer" style="width:100%; height:60vh; background:#000;"></div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
