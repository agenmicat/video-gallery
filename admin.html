<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard - Video Gallery</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* styling admin seperti sebelumnya */
    #dashboardSection { display: none; }
    #loginSection {
      max-width: 400px; margin: 50px auto; padding: 20px;
      background: #1a1a1a; border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.7);
    }
    #loginSection input {
      width: 100%; padding: 12px; margin-bottom: 15px;
      background: #121212; border: 2px solid #4ecdc4; border-radius: 10px;
      color: white; font-size: 16px;
    }
    #loginSection button {
      width: 100%; padding: 15px;
      background: #4ecdc4; border: none; border-radius: 10px;
      font-weight: bold; font-size: 18px; color: #000; cursor: pointer;
    }
    #loginSection button:hover {
      background: #3bb8b1;
    }
    #videosContainer div.video-admin-item {
      border: 1px solid #333;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: #121212;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }
    #videosContainer button {
      background: #f44336;
      border: none;
      padding: 6px 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: background 0.3s ease;
    }
    #videosContainer button:hover {
      background: #e53935;
    }
    #importFile {
      margin-top: 10px;
      margin-bottom: 10px;
      width: 100%;
      padding: 6px;
      background: #121212;
      border: 2px solid #4ecdc4;
      border-radius: 8px;
      color: white;
    }
    #importBtn {
      background: #4ecdc4;
      border: none;
      color: #000;
      font-weight: 600;
      padding: 12px 25px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }
    #importBtn:hover {
      background: #3bb8b1;
    }
  </style>
</head>
<body>
  <div class="container">
    <section id="loginSection">
      <h2>Login Admin</h2>
      <input id="adminPass" type="password" placeholder="Masukkan Password Admin" />
      <button id="loginBtn">Login</button>
    </section>

    <section id="dashboardSection">
      <h1>Dashboard Admin - Video Gallery</h1>
      <button id="logoutBtn" style="margin-bottom: 20px; background: #f44336; color: #fff; font-size: 14px; padding: 8px 20px; border: none; border-radius: 10px; cursor: pointer;">Logout</button>

      <h2>Tambah Video Baru</h2>
      <form id="addVideoForm">
        <input type="text" id="title" placeholder="Judul Video" required />
        <input type="url" id="thumbnail" placeholder="URL Thumbnail (opsional)" />
        <input type="url" id="url" placeholder="URL Video/Embed" required />
        <input type="text" id="tags" placeholder="Tags (pisah dengan koma)" />
        <input type="text" id="duration" placeholder="Durasi (ex: 1:30)" />
        <button type="submit">Tambah Video</button>
      </form>

      <h2>Import Video Dari File (JSON atau CSV)</h2>
      <input type="file" id="importFile" accept=".json,.csv" />
      <button id="importBtn">Import Data</button>

      <h2>Daftar Video</h2>
      <div id="videosContainer"></div>
    </section>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
